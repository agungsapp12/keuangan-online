<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menabung</title>

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f4f6f9;
  color: #1f2937;
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(135deg, #2563eb, #1e40af);
  color: #fff;
  padding: 16px 20px;
}

.header-wrap {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

header h1 {
  font-size: 20px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ===== CARD ===== */
.card {
  max-width: 420px;
  width: 92%;
  margin: 30px auto;
  background: #fff;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 6px 16px rgba(0,0,0,.06);
}

.card h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== FORM ===== */
.form-group { margin-bottom: 14px; }

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-family: inherit;
}

button {
  background: #16a34a;
  color: #fff;
  border: none;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button:hover { background: #15803d; }

#msg {
  margin-top: 12px;
  text-align: center;
  font-weight: 600;
}

/* ===== METODE PEMBAYARAN ===== */
.qr-box {
  margin-top: 26px;
  padding: 18px;
  border-radius: 14px;
  background: #f9fafb;
  border: 1px dashed #cbd5e1;
}

.qr-box h3 {
  text-align: center;
  margin-bottom: 14px;
  font-size: 15px;
}

.payment-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border-radius: 10px;
  background: #ffffff;
  box-shadow: 0 3px 8px rgba(0,0,0,.04);
  margin-bottom: 10px;
}

.payment-left {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}

.payment-left i {
  font-size: 20px;
  color: #2563eb;
}

.payment-right {
  font-size: 14px;
  font-weight: 600;
}

.payment-right a {
  text-decoration: none;
  background: #2563eb;
  color: #fff;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
}

.payment-right a:hover {
  background: #1e40af;
}
</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <h1><i class="fa-solid fa-piggy-bank"></i> Menabung</h1>
    <nav>
      <a href="home.html"><i class="fa-solid fa-plus"></i> Input</a>
      <a href="menabung.html"><i class="fa-solid fa-piggy-bank"></i> Menabung</a>
      <a href="dashboard.html"><i class="fa-solid fa-table"></i> Dashboard</a>
    </nav>
  </div>
</header>

<div class="card">
  <h2>Input Menabung</h2>

  <div class="form-group">
    <label>Nama</label>
    <select id="nama" required>
      <option value="">Pilih Nama</option>
      <option value="Agung">Agung</option>
      <option value="Febby">Febby</option>
    </select>
  </div>

  <div class="form-group">
    <label>Tanggal</label>
    <input type="date" id="tanggal" required>
  </div>

  <div class="form-group">
    <label>Kategori</label>
    <input type="text" value="Menabung" disabled>
  </div>

  <div class="form-group">
    <label>Keterangan</label>
    <input type="text" id="keterangan" placeholder="Contoh: Tabungan bulan ini">
  </div>

  <div class="form-group">
    <label>Jumlah (Rp)</label>
    <input type="number" id="jumlah" placeholder="Contoh: 100000" required>
  </div>

  <button onclick="kirim()">
    <i class="fa-solid fa-floppy-disk"></i> Simpan Menabung
  </button>

  <div id="msg"></div>

  <!-- ===== METODE PEMBAYARAN ===== -->
  <div class="qr-box">
    <h3><i class="fa-solid fa-credit-card"></i> Metode Pembayaran</h3>

    <div class="payment-item">
      <div class="payment-left">
        <i class="fa-solid fa-building-columns"></i>
        SeaBank
      </div>
      <div class="payment-right">
        901720634294
      </div>
    </div>

    <div class="payment-item">
      <div class="payment-left">
        <i class="fa-solid fa-wallet"></i>
        DANA
      </div>
      <div class="payment-right">
        <a href="https://link.dana.id/minta?full_url=https://qr.dana.id/v1/281012012021061906525923" target="_blank">
          Buka QR
        </a>
      </div>
    </div>
  </div>

</div>

<script>
const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycby_CyQUM04INyKnXd1BEsmyR7cSafCAYFjEbm0MINgGd58ByUeIjvk5yq8g2Xr6jMAA/exec";

document.getElementById("tanggal").valueAsDate = new Date();

function kirim() {
  if (!nama.value || !tanggal.value || !jumlah.value) {
    msg.innerText = "❗ Semua field wajib diisi";
    msg.style.color = "red";
    return;
  }

  const data = new URLSearchParams({
    nama: nama.value,
    tanggal: tanggal.value,
    kategori: "Menabung",
    keterangan: keterangan.value,
    jumlah: jumlah.value
  });

  msg.innerText = "⏳ Menyimpan data...";
  msg.style.color = "#374151";

  fetch(URL_APPS_SCRIPT, { method: "POST", body: data })
    .then(res => res.text())
    .then(() => {
      msg.innerText = "✅ Menabung berhasil disimpan";
      msg.style.color = "green";
      jumlah.value = "";
      keterangan.value = "";
    })
    .catch(() => {
      msg.innerText = "❌ Gagal menyimpan data";
      msg.style.color = "red";
    });
}
</script>

</body>
</html>
