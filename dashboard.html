<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Keuangan</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
}

.header {
  background: #2c3e50;
  color: #fff;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header a {
  color: #fff;
  text-decoration: none;
  margin-left: 20px;
  font-weight: bold;
}

.container {
  width: 95%;
  max-width: 1000px;
  margin: 30px auto;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: left;
}

th {
  background: #3498db;
  color: #fff;
}

.total {
  font-size: 26px;
  color: #27ae60;
}
</style>
</head>

<body>

<div class="header">
  <div>📊 Dashboard Keuangan</div>
  <div>
    <a href="index.html">Input</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</div>

<div class="container">

<div class="card">
<label>Pilih Nama:</label>
<select id="nama" onchange="loadData()">
  <option value="Agung">Agung</option>
  <option value="Febby">Febby</option>
</select>
</div>

<div class="card">
<h3>Total Pengeluaran</h3>
<div class="total" id="total">Rp 0</div>
</div>

<div class="card">
<h3>Data Pengeluaran</h3>
<table>
<thead>
<tr>
  <th>Tanggal</th>
  <th>Kategori</th>
  <th>Keterangan</th>
  <th>Jumlah</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<script>
// ✅ ID GOOGLE SHEETS KAMU
const SHEET_ID = "19K7Bjz9K5N4syqAQHH21Say8X4KcC0xLGUc-b6YFCws";

function loadData() {
  const nama = document.getElementById("nama").value;
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${nama}`;

  fetch(url)
    .then(res => res.text())
    .then(text => {
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      let total = 0;
      let html = "";

      rows.forEach(r => {
        const tanggal = r.c[2]?.v || "";
        const kategori = r.c[3]?.v || "";
        const ket = r.c[4]?.v || "";
        const jumlah = Number(r.c[5]?.v || 0);

        total += jumlah;

        html += `
        <tr>
          <td>${tanggal}</td>
          <td>${kategori}</td>
          <td>${ket}</td>
          <td>Rp ${jumlah.toLocaleString()}</td>
        </tr>`;
      });

      tbody.innerHTML = html;
      totalEl = document.getElementById("total");
      totalEl.innerText = "Rp " + total.toLocaleString();
    });
}

loadData();
</script>

</body>
</html>
