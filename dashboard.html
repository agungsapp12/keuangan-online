<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Keuangan</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ICON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- FONT -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f4f6f9;
      color: #1f2937;
    }

    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: #fff;
      padding: 16px 20px;
    }

    .header-wrap {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 20px;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav a {
      text-decoration: none;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,.15);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: .2s;
    }

    nav a:hover {
      background: rgba(255,255,255,.25);
    }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* ===== FILTER ===== */
    .filter {
      background: #fff;
      padding: 16px;
      border-radius: 14px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      font-family: inherit;
    }

    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      background: #2563eb;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      background: #1e40af;
    }

    /* ===== CARD ===== */
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,.06);
      margin-bottom: 20px;
    }

    .total {
      font-size: 26px;
      font-weight: 800;
      color: #dc2626;
      margin-top: 6px;
    }

    /* ===== TABLE ===== */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 14px;
      white-space: nowrap;
    }

    th {
      background: #f1f5f9;
      font-weight: 700;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .filter {
        grid-template-columns: 1fr 1fr;
      }

      .total {
        font-size: 22px;
      }
    }

    @media (max-width: 480px) {
      .filter {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 18px;
      }

      nav {
        width: 100%;
        justify-content: center;
      }

      nav a {
        flex: 1;
        justify-content: center;
      }

      th, td {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-wrap">
    <h1><i class="fa-solid fa-chart-line"></i> Dashboard Keuangan</h1>
    <nav>
      <a href="home.html"><i class="fa-solid fa-plus"></i> Input</a>
      <a href="dashboard.html"><i class="fa-solid fa-table"></i> Dashboard</a>
    </nav>
  </div>
</header>

<div class="container">

  <!-- FILTER -->
  <div class="filter">
    <select id="filterNama">
      <option value="Agung">Agung</option>
      <option value="Febby">Febby</option>
    </select>

    <select id="filterBulan">
      <option value="">Semua Bulan</option>
      <option value="0">Januari</option>
      <option value="1">Februari</option>
      <option value="2">Maret</option>
      <option value="3">April</option>
      <option value="4">Mei</option>
      <option value="5">Juni</option>
      <option value="6">Juli</option>
      <option value="7">Agustus</option>
      <option value="8">September</option>
      <option value="9">Oktober</option>
      <option value="10">November</option>
      <option value="11">Desember</option>
    </select>

    <select id="filterTahun"></select>

    <button onclick="loadData()">
      <i class="fa-solid fa-filter"></i> Terapkan
    </button>
  </div>

  <!-- TOTAL -->
  <div class="card">
    <div>Total Pengeluaran</div>
    <div class="total" id="total">Rp 0</div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Kategori</th>
            <th>Keterangan</th>
            <th>Jumlah</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SHEET_ID = "19K7Bjz9K5N4syqAQHH21Say8X4KcC0xLGUc-b6YFCws";

const filterNama = document.getElementById("filterNama");
const filterBulan = document.getElementById("filterBulan");
const filterTahun = document.getElementById("filterTahun");
const tbody = document.getElementById("tbody");
const totalEl = document.getElementById("total");

const now = new Date().getFullYear();
for (let y = now; y >= now - 5; y--) {
  filterTahun.innerHTML += `<option value="${y}">${y}</option>`;
}

function parseGoogleDate(v) {
  const m = v.match(/Date\((\d+),(\d+),(\d+)\)/);
  return m ? new Date(m[1], m[2], m[3]) : null;
}

function loadData() {
  const nama = filterNama.value;
  const bulan = filterBulan.value;
  const tahun = filterTahun.value;

  fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${nama}`)
    .then(res => res.text())
    .then(txt => {
      const json = JSON.parse(txt.substring(47).slice(0, -2));
      let total = 0;
      let html = "";

      json.table.rows.forEach(r => {
        if (!r.c[2]?.v) return;

        const tgl = parseGoogleDate(r.c[2].v);
        if (!tgl) return;

        if (bulan !== "" && tgl.getMonth() != bulan) return;
        if (tahun && tgl.getFullYear() != tahun) return;

        const kategori = r.c[3]?.v || "";
        const ket = r.c[4]?.v || "";
        const jumlah = Number(r.c[5]?.v || 0);

        total += jumlah;

        html += `
          <tr>
            <td>${tgl.toLocaleDateString("id-ID")}</td>
            <td>${kategori}</td>
            <td>${ket}</td>
            <td>Rp ${jumlah.toLocaleString("id-ID")}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      totalEl.innerText = "Rp " + total.toLocaleString("id-ID");
    });
}

loadData();
</script>

</body>
</html>
