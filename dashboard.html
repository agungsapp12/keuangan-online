<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Keuangan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f4f6f9;
  color: #1f2937;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #2563eb, #1e40af);
  color: #fff;
  padding: 16px 20px;
}

.header-wrap {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

header h1 {
  font-size: 20px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  gap: 6px;
}

nav a:hover {
  background: rgba(255,255,255,.25);
}

/* CONTAINER */
.container {
  max-width: 1100px;
  margin: 24px auto;
  padding: 0 16px;
}

/* FILTER */
.filter {
  background: #fff;
  padding: 16px;
  border-radius: 14px;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
  margin-bottom: 20px;
  box-shadow: 0 6px 16px rgba(0,0,0,.06);
}

select, button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-size: 14px;
}

button {
  background: #2563eb;
  color: #fff;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

/* SUMMARY */
.summary {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 16px;
  margin-bottom: 20px;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  box-shadow: 0 6px 16px rgba(0,0,0,.06);
}

.total-red {
  font-size: 24px;
  font-weight: 800;
  color: #dc2626;
}

.total-green {
  font-size: 24px;
  font-weight: 800;
  color: #16a34a;
}

.total-blue {
  font-size: 24px;
  font-weight: 800;
  color: #2563eb;
}

.total-dark {
  font-size: 26px;
  font-weight: 900;
  color: #111827;
}

/* TABLE */
.table-wrap {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  min-width: 700px;
  border-collapse: collapse;
}

th, td {
  padding: 14px 12px;
  border-bottom: 1px solid #e5e7eb;
  font-size: 14px;
}

th {
  background: #f1f5f9;
  text-align: left;
}

.text-right {
  text-align: right;
  font-weight: 600;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .filter { grid-template-columns: 1fr 1fr; }
  .summary { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 480px) {
  .summary { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <h1><i class="fa-solid fa-wallet"></i> Keuangan Online</h1>
    <nav>
      <a href="home.html"><i class="fa-solid fa-plus"></i> Input</a>
      <a href="pemasukan.html"><i class="fa-solid fa-money-bill"></i> Pemasukan</a>
      <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
    </nav>
  </div>
</header>

<div class="container">

  <!-- FILTER -->
  <div class="filter">
    <select id="filterNama">
      <option value="Agung">Agung</option>
      <option value="Febby">Febby</option>
    </select>

    <select id="filterBulan">
      <option value="">Semua Bulan</option>
      <option value="0">Jan</option><option value="1">Feb</option>
      <option value="2">Mar</option><option value="3">Apr</option>
      <option value="4">Mei</option><option value="5">Jun</option>
      <option value="6">Jul</option><option value="7">Agu</option>
      <option value="8">Sep</option><option value="9">Okt</option>
      <option value="10">Nov</option><option value="11">Des</option>
    </select>

    <select id="filterTahun"></select>
    <button onclick="loadAll()">Terapkan</button>
  </div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="card">
      <div>Total Pemasukan</div>
      <div class="total-blue" id="totalIn">Rp 0</div>
    </div>

    <div class="card">
      <div>Total Pengeluaran</div>
      <div class="total-red" id="totalOut">Rp 0</div>
    </div>

    <div class="card">
      <div>Total Menabung</div>
      <div class="total-green" id="totalSave">Rp 0</div>
    </div>

    <div class="card">
      <div>Saldo</div>
      <div class="total-dark" id="saldo">Rp 0</div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Kategori</th>
            <th>Keterangan</th>
            <th class="text-right">Jumlah</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SHEET_ID = "19K7Bjz9K5N4syqAQHH21Say8X4KcC0xLGUc-b6YFCws";
const tbody = document.getElementById("tbody");

const totalInEl = document.getElementById("totalIn");
const totalOutEl = document.getElementById("totalOut");
const totalSaveEl = document.getElementById("totalSave");
const saldoEl = document.getElementById("saldo");

const filterNama = document.getElementById("filterNama");
const filterBulan = document.getElementById("filterBulan");
const filterTahun = document.getElementById("filterTahun");

const now = new Date().getFullYear();
for (let y = now; y >= now - 5; y--) {
  filterTahun.innerHTML += `<option value="${y}">${y}</option>`;
}

function parseDate(v) {
  const m = v.match(/Date\((\d+),(\d+),(\d+)\)/);
  return m ? new Date(m[1], m[2], m[3]) : null;
}

function fetchSheet(sheet) {
  return fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${sheet}`)
    .then(r => r.text())
    .then(t => JSON.parse(t.substring(47).slice(0, -2)));
}

async function loadAll() {
  let totalIn = 0;
  let totalOut = 0;
  let totalSave = 0;
  let html = "";

  const data = await fetchSheet(filterNama.value);

  data.table.rows.forEach(r => {
    if (!r.c[2]?.v) return;
    const tgl = parseDate(r.c[2].v);
    if (!tgl) return;

    if (filterBulan.value !== "" && tgl.getMonth() != filterBulan.value) return;
    if (filterTahun.value && tgl.getFullYear() != filterTahun.value) return;

    const kategori = r.c[3]?.v || "";
    const ket = r.c[4]?.v || "-";
    const jumlah = Number(r.c[5]?.v || 0);
    const pemasukan = Number(r.c[6]?.v || 0);

    if (kategori === "Menabung") totalSave += jumlah;
    else if (kategori !== "Pemasukan") totalOut += jumlah;

    totalIn += pemasukan;

    html += `
      <tr>
        <td>${tgl.toLocaleDateString("id-ID")}</td>
        <td>${kategori}</td>
        <td>${ket}</td>
        <td class="text-right">Rp ${(jumlah || pemasukan).toLocaleString("id-ID")}</td>
      </tr>`;
  });

  tbody.innerHTML = html;

  totalInEl.innerText = "Rp " + totalIn.toLocaleString("id-ID");
  totalOutEl.innerText = "Rp " + totalOut.toLocaleString("id-ID");
  totalSaveEl.innerText = "Rp " + totalSave.toLocaleString("id-ID");
  saldoEl.innerText = "Rp " + (totalIn - totalOut).toLocaleString("id-ID");
}

loadAll();
</script>

</body>
</html>
