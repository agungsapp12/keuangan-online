<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Keuangan</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f4f6f8;
  color: #333;
}

/* ===== HEADER KEREN ===== */
.header {
  background: linear-gradient(135deg, #1d2671, #c33764);
  color: #fff;
  padding: 18px 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.brand {
  font-size: 20px;
  font-weight: bold;
}

.brand span {
  font-size: 13px;
  opacity: 0.85;
  display: block;
}

.nav a {
  color: #fff;
  text-decoration: none;
  margin-left: 18px;
  font-weight: 600;
}

/* ===== CONTAINER ===== */
.container {
  width: 95%;
  max-width: 1150px;
  margin: 25px auto;
}

/* ===== CARD ===== */
.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* ===== FILTER BAR ===== */
.filter-bar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  align-items: end;
}

.filter-bar label {
  font-size: 13px;
  font-weight: bold;
}

select, button {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background: linear-gradient(135deg, #1d976c, #93f9b9);
  color: #004d40;
  font-weight: bold;
  border: none;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* ===== SUMMARY ===== */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 15px;
}

.summary-box {
  background: linear-gradient(135deg, #2193b0, #6dd5ed);
  color: #fff;
  padding: 22px;
  border-radius: 16px;
}

.summary-box h3 {
  margin: 0;
  font-size: 14px;
  opacity: 0.9;
}

.summary-box h2 {
  margin: 8px 0 0;
  font-size: 28px;
}

/* ===== TABLE ===== */
.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #e0e0e0;
  font-size: 14px;
}

th {
  background: #34495e;
  color: #fff;
  position: sticky;
  top: 0;
}

tbody tr:hover {
  background: #f1f6ff;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    align-items: flex-start;
  }

  .nav {
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="brand">
    💰 Keuangan Online
    <span>Dashboard Pengeluaran</span>
  </div>
  <div class="nav">
    <a href="index.html">Input</a>
    <a href="dashboard.html">Dashboard</a>
  </div>
</div>

<!-- ===== CONTENT ===== -->
<div class="container">

  <!-- FILTER -->
  <div class="card">
    <div class="filter-bar">
      <div>
        <label>Nama</label>
        <select id="filterNama">
          <option value="Agung">Agung</option>
          <option value="Febby">Febby</option>
        </select>
      </div>

      <div>
        <label>Bulan</label>
        <select id="filterBulan">
          <option value="">Semua</option>
          <option value="0">Januari</option>
          <option value="1">Februari</option>
          <option value="2">Maret</option>
          <option value="3">April</option>
          <option value="4">Mei</option>
          <option value="5">Juni</option>
          <option value="6">Juli</option>
          <option value="7">Agustus</option>
          <option value="8">September</option>
          <option value="9">Oktober</option>
          <option value="10">November</option>
          <option value="11">Desember</option>
        </select>
      </div>

      <div>
        <label>Tahun</label>
        <select id="filterTahun"></select>
      </div>

      <div>
        <label>&nbsp;</label>
        <button onclick="loadData()">Terapkan Filter</button>
      </div>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="summary-box">
      <h3>Total Pengeluaran</h3>
      <h2 id="total">Rp 0</h2>
    </div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Riwayat Pengeluaran</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Tanggal</th>
            <th>Kategori</th>
            <th>Keterangan</th>
            <th>Jumlah</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SHEET_ID = "19K7Bjz9K5N4syqAQHH21Say8X4KcC0xLGUc-b6YFCws";

// isi dropdown tahun otomatis
const yearNow = new Date().getFullYear();
for (let y = yearNow; y >= yearNow - 5; y--) {
  filterTahun.innerHTML += `<option value="${y}">${y}</option>`;
}

function loadData() {
  const nama = filterNama.value;
  const bulan = filterBulan.value;
  const tahun = filterTahun.value;

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${nama}`;

  fetch(url)
    .then(res => res.text())
    .then(text => {
      const json = JSON.parse(text.substring(47).slice(0, -2));
      const rows = json.table.rows;

      let total = 0;
      let html = "";

      rows.forEach(r => {
        if (!r.c[2]) return;

        const tanggalObj = new Date(r.c[2].v);
        if (bulan !== "" && tanggalObj.getMonth() != bulan) return;
        if (tahun && tanggalObj.getFullYear() != tahun) return;

        const kategori = r.c[3]?.v || "";
        const ket = r.c[4]?.v || "";
        const jumlah = Number(r.c[5]?.v || 0);

        total += jumlah;

        html += `
          <tr>
            <td>${tanggalObj.toLocaleDateString()}</td>
            <td>${kategori}</td>
            <td>${ket}</td>
            <td>Rp ${jumlah.toLocaleString()}</td>
          </tr>
        `;
      });

      tbody.innerHTML = html;
      total.innerText = "Rp " + total.toLocaleString();
    });
}

// load awal
loadData();
</script>

</body>
</html>
