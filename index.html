<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Online</title>

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  font-family: 'Inter', sans-serif;
  color: #1f2937;
}

/* ================= VIDEO BACKGROUND ================= */
.video-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

/* ================= HEADER ================= */
header {
  background: rgba(37, 99, 235, 0.85);
  backdrop-filter: blur(6px);
  color: #fff;
  padding: 18px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

header p {
  margin-top: 6px;
  font-size: 12px;
  opacity: .9;
}

/* ================= CONTAINER ================= */
.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 0 14px;
}

/* ================= MENU GRID (KAI STYLE) ================= */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}

.menu-card {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 16px 10px;
  text-align: center;
  text-decoration: none;
  color: #1f2937;
  box-shadow: 0 6px 14px rgba(0,0,0,.15);
  transition: 0.2s;
}

/* ICON */
.menu-card i {
  font-size: 26px;
  margin-bottom: 6px;
  color: #2563eb;
}

/* TITLE */
.menu-card h3 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}

/* DESC */
.menu-card p {
  display: none; /* ala KAI: tidak pakai deskripsi */
}

/* HOVER */
.menu-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 20px rgba(0,0,0,.25);
}

/* ================= RESPONSIVE ================= */
@media (max-width: 900px) {
  .menu-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 600px) {
  .menu-grid { grid-template-columns: repeat(4, 1fr); }
  header h1 { font-size: 18px; }
}

@media (max-width: 420px) {
  .menu-grid { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video class="video-bg" autoplay muted loop playsinline>
  <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<header>
  <h1><i class="fa-solid fa-wallet"></i> Keuangan Online</h1>
  <p>Pilih menu untuk melanjutkan</p>
</header>

<div class="container">
  <div class="menu-grid">

    <a href="home.html" class="menu-card">
      <i class="fa-solid fa-plus-circle"></i>
      <h3>Input</h3>
    </a>

    <a href="dashboard.html" class="menu-card">
      <i class="fa-solid fa-chart-line"></i>
      <h3>Dashboard</h3>
    </a>

    <a href="edit.html" class="menu-card">
      <i class="fa-solid fa-pen-to-square"></i>
      <h3>Edit</h3>
    </a>

    <a href="menabung.html" class="menu-card">
      <i class="fa-solid fa-piggy-bank"></i>
      <h3>Menabung</h3>
    </a>

  </div>
</div>

</body>
</html>
