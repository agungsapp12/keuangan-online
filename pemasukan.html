<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Pemasukan</title>

<!-- ICON -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #f4f6f9;
  color: #1f2937;
}

/* ===== HEADER ===== */
header {
  background: linear-gradient(135deg, #16a34a, #166534);
  color: #fff;
  padding: 16px 20px;
}

.header-wrap {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

header h1 {
  font-size: 20px;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  gap: 6px;
}

nav a:hover {
  background: rgba(255,255,255,.25);
}

/* ===== CARD ===== */
.card {
  max-width: 420px;
  width: 92%;
  margin: 30px auto;
  background: #fff;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 6px 16px rgba(0,0,0,.06);
}

.card h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== FORM ===== */
.form-group { margin-bottom: 14px; }

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  font-size: 14px;
  border-radius: 10px;
  border: 1px solid #d1d5db;
  font-family: inherit;
}

input:focus, select:focus {
  outline: none;
  border-color: #16a34a;
}

button {
  background: #16a34a;
  color: #fff;
  border: none;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button:hover {
  background: #15803d;
}

#msg {
  margin-top: 12px;
  text-align: center;
  font-weight: 600;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  header h1 { font-size: 18px; }
  nav { width: 100%; justify-content: center; }
  nav a { flex: 1; justify-content: center; }
}
</style>
</head>

<body>

<header>
  <div class="header-wrap">
    <h1><i class="fa-solid fa-money-bill-wave"></i> Input Pemasukan</h1>
    <nav>
      <a href="home.html"><i class="fa-solid fa-minus"></i> Pengeluaran</a>
      <a href="dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
      <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
    </nav>
  </div>
</header>

<div class="card">
  <h2>Tambah Pemasukan</h2>

  <div class="form-group">
    <label>Nama</label>
    <select id="nama" required>
      <option value="">Pilih Nama</option>
      <option value="Agung">Agung</option>
      <option value="Febby">Febby</option>
    </select>
  </div>

  <div class="form-group">
    <label>Tanggal</label>
    <input type="date" id="tanggal" required>
  </div>

  <div class="form-group">
    <label>Kategori</label>
    <input type="text" value="Pemasukan" disabled>
  </div>

  <div class="form-group">
    <label>Keterangan</label>
    <input type="text" id="keterangan" placeholder="Contoh: Gaji, Bonus, Freelance">
  </div>

  <div class="form-group">
    <label>Jumlah (Rp)</label>
    <input type="number" id="jumlah" placeholder="Contoh: 2500000" required>
  </div>

  <button onclick="kirim()">
    <i class="fa-solid fa-floppy-disk"></i> Simpan Pemasukan
  </button>

  <div id="msg"></div>
</div>

<script>
const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbxgpiyHTudoz2_gaoD3lkUzv-3S42WIiTx1s1bBEOOUD9Bcpc_AyIC4E2Z-Zikp0Aq3/exec";

// default tanggal hari ini
document.getElementById("tanggal").valueAsDate = new Date();

function kirim() {
  if (!nama.value || !tanggal.value || !jumlah.value) {
    msg.innerText = "❗ Semua field wajib diisi";
    msg.style.color = "red";
    return;
  }

  const data = new URLSearchParams({
    nama: nama.value,
    tanggal: tanggal.value,
    kategori: "Pemasukan",
    keterangan: keterangan.value,
    jumlah: jumlah.value
  });

  msg.innerText = "⏳ Menyimpan data...";
  msg.style.color = "#374151";

  fetch(URL_APPS_SCRIPT, {
    method: "POST",
    body: data
  })
  .then(res => res.text())
  .then(() => {
    msg.innerText = "✅ Pemasukan berhasil disimpan";
    msg.style.color = "green";
    jumlah.value = "";
    keterangan.value = "";
  })
  .catch(() => {
    msg.innerText = "❌ Gagal menyimpan data";
    msg.style.color = "red";
  });
}
</script>

</body>
</html>
